# Weld-line mission state machine. Fixed goal coordinates are placeholders and
# must be replaced with surveyed map poses before operating the real robot.
version: 2
frame_id: "map"

detector:
  goal_topic: "/goal_pose"
  stable_samples: 5
  max_position_spread_m: 0.03
  max_yaw_spread_deg: 0.75
  max_goal_age_sec: 0.50

control:
  enabled: true
  rate_hz: 20.0
  command_topic: "/fsm_cmd"
  status_topic: "/commander/scenario/status"
  robot_frame: "base_link"
  position_kp: 0.60
  max_linear_speed_mps: 0.20
  wall_alignment_kp: 1.50
  waypoint_yaw_kp: 1.20
  max_angular_speed_rps: 0.45

goals:
  weldline: {source: detector}
  destination_1: {source: fixed, x: 0.75, y: 0.00, yaw_deg: 0.0}
  destination_2: {source: fixed, x: 1.50, y: 0.00, yaw_deg: 0.0}
  destination_3: {source: fixed, x: 2.00, y: 0.00, yaw_deg: 0.0}

mission:
  - {name: WAIT_WELDLINE_GOAL, action: wait_detection, goal: weldline}
  - {name: MOVE_WELDLINE, action: move, goal: weldline, position_tolerance_m: 0.04}
  - {name: TURN_LEFT_90, action: turn, angle_deg: 90.0, angle_tolerance_deg: 0.75, wall_angle_deg: -90.0, wall_tolerance_deg: 1.0}
  - {name: MOVE_DESTINATION_1, action: move, goal: destination_1, position_tolerance_m: 0.05}
  - {name: ALIGN_WALL_1, action: align_wall, angle_tolerance_deg: 0.50}
  - {name: SIT, action: sit, requires_resume: true}
  - {name: MOVE_DESTINATION_2, action: move, goal: destination_2, position_tolerance_m: 0.05}
  - {name: ALIGN_WALL_2, action: align_wall, angle_tolerance_deg: 0.50}
  - {name: MOVE_DESTINATION_3, action: move, goal: destination_3, position_tolerance_m: 0.05}
  - {name: TURN_180, action: turn, angle_deg: 180.0, angle_tolerance_deg: 0.75, wall_angle_deg: 0.0, wall_tolerance_deg: 1.0}
  - {name: ALIGN_WALL_3, action: align_wall, angle_tolerance_deg: 0.50}
  - {name: RETURN_DESTINATION_2, action: move, goal: destination_2, position_tolerance_m: 0.05}
  - {name: ALIGN_WALL_4, action: align_wall, angle_tolerance_deg: 0.50}
  - {name: RETURN_DESTINATION_1, action: move, goal: destination_1, position_tolerance_m: 0.05}
  - {name: ALIGN_WALL_5, action: align_wall, angle_tolerance_deg: 0.50}
  - {name: RETURN_WELDLINE, action: move, goal: weldline, position_tolerance_m: 0.04}
