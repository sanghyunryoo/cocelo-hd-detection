weldline_goal_node:
  ros__parameters:
    # launch.sh exports this before ROS starts.
    ros_domain_id: 0

    # "auto" selects the only connected Intel RealSense device. If multiple
    # cameras are connected, set this to the intended USB topology, e.g. "2-3.4".
    usb_port_id: "auto"

    weights: "weights/best.onnx"
    color_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"

    output_frame: "map"
    processing_rate_hz: 30.0
    target_class_id: -1
    confidence_threshold: 0.40
    nms_threshold: 0.25
    depth_window: 7
    use_line_detection: true
    allow_latest_tf_fallback: true

    # Nav2 consumes geometry_msgs/PoseStamped; downstream code can subscribe
    # here and convert this weldline goal into waypoint arrays.
    nav2_planar_goal: true
    goal_topic: "/weldline/goal_pose"
