yolo_weldline_3d_node:
  ros__parameters:
    # Deployment settings consumed by launch.sh before ROS 2 starts.
    # ros_domain_id is exported as ROS_DOMAIN_ID; usb_port_id selects the physical RealSense.
    ros_domain_id: 0
    usb_port_id: ""
    # Relative paths are resolved by launch.sh; deploy an ONNX model with the package or pass weights:=.
    weights: "weights/best.onnx"
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    output_frame: "map"
    processing_rate_hz: 30.0
    # -1 accepts the best class from the model. COCO person-only filtering uses target_class_id: 0.
    target_class_id: -1
    confidence_threshold: 0.40
    nms_threshold: 0.25
    depth_window: 7
    use_line_detection: true
    nav2_planar_goal: false
    nav2_goal_topic: "/goal_pose"
    debug_point_topic: "/weldline_yolo/debug/center_point"
    marker_topic: "/weldline_yolo/debug/markers"
    annotated_topic: "/weldline_yolo/debug/annotated_image"
